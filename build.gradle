plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_mappings}")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // ThreeTAG (Palladium + palladiumcore)
        maven { url 'https://maven.threetag.net' }

        // Parchment mappings
        maven {
            url = 'https://maven.parchmentmc.net/'
            content { includeGroup 'org.parchmentmc.data' }
        }

        // GeckoLib (Palladium hard-depends on it for suit/animation rendering)
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        }

        // Player Animator (Palladium dependency)
        maven { name = "KosmX's maven"; url = 'https://maven.kosmx.dev/' }

        // Trinkets (Fabric accessory slots used by Palladium)
        maven { url = "https://maven.terraformersmc.com/releases/" }

        // Cardinal Components (Fabric player data used by Palladium)
        maven { name = 'Ladysnake Mods'; url = 'https://maven.ladysnake.org/releases' }

        // Porting Lib
        maven { url = "https://mvn.devos.one/releases/" }
        maven { url = "https://mvn.devos.one/snapshots/" }

        // Reach Entity Attributes
        maven {
            url = 'https://maven.jamieswhiteshirt.com/libs-release'
            content { includeGroup 'com.jamieswhiteshirt' }
        }

        // Forge Config API Port (Palladium dependency)
        maven {
            name = 'Fuzs Mod Resources'
            url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            content { includeGroup 'fuzs.forgeconfigapiport' }
        }

        // JEI (Forge compat dependency of Palladium)
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com/'
            content { includeGroup 'mezz.jei' }
        }

        // Modrinth maven (Sodium and other compat deps pulled in by Palladium)
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }

        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}
